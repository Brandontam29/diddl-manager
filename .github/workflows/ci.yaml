name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  website:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint:website

      - name: Typecheck
        run: bun run typecheck:website

      - name: Unit tests
        run: bun run --filter @diddl/website test:unit

      # The authorization-scoping suite runs against the Neon `test` branch (spec §10).
      # Both steps are skipped until the TEST_DATABASE_URL / TEST_DATABASE_URL_UNPOOLED
      # repository secrets exist, so a missing secret shows as "skipped", never as green.
      - name: Migrate the Neon test branch
        if: env.TEST_DATABASE_URL_UNPOOLED != ''
        run: bun run --filter @diddl/website db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ env.TEST_DATABASE_URL_UNPOOLED }}

      - name: Integration tests
        if: env.TEST_DATABASE_URL != ''
        run: bun run --filter @diddl/website test:integration
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Build
        run: bun run build:website
