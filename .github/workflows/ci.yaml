name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint:website

      - name: Typecheck
        run: bun run typecheck:website

      # db:migrate against the Neon `test` branch + integration tests are added by
      # "Server functions and the authorization-scoping suite" once the secrets exist.
      - name: Unit tests
        run: bun run --filter @diddl/website test:unit

      - name: Build
        run: bun run build:website
